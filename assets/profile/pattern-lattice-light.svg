<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="pattern-title pattern-desc">
<title id="pattern-title">Neurodivergent Pattern Map</title>
<desc id="pattern-desc">Mapa visual que conecta comercio, empresa agéntica, contabilidad chilena, GRC y skills, infraestructura MCP y automatización social mediante patrones comunes de autoridad, evidencia, costo y outcome.</desc>
<defs>
  <linearGradient id="pattern-core" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F9F7F"/>
    <stop offset="0.52" stop-color="#2563EB"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
</defs>
<rect width="1200" height="520" rx="28" fill="#F8FAFC"/>
<rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#E2E8F0"/>
<text x="48" y="42" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="800" letter-spacing="1.5" fill="#0F9F7F">NEURODIVERGENT PATTERN MAP</text>
<text x="1152" y="42" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#64748B">VARIETY → STRUCTURE → TRANSFER</text>

